<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <script>
        // Apply a remembered light/dark choice before the page paints, so it doesn't flash.
        try {
            const theme = localStorage.getItem('chart-generator-theme');
            if (theme === 'light' || theme === 'dark') {
                document.documentElement.dataset.theme = theme;
            }
        } catch (error) {}
    </script>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <!-- Bump ?v= whenever style.css or script.js change, so browsers don't mix a new page with old cached files. -->
    <link rel="stylesheet" href="style.css?v=8">
    <title>Chart Generator</title>
</head>

<body>

    <div class="app">
        <aside class="sidebar glass">
            <div class="sidebar-header">
                <h1 class="app-title">Chart Generator</h1>
                <div class="theme-switch" role="group" aria-label="Appearance">
                    <button type="button" data-theme-choice="system" title="Follow system" aria-label="Follow system">
                        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 3.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg>
                    </button>
                    <button type="button" data-theme-choice="light" title="Light" aria-label="Light">
                        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6" fill="currentColor"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M10 1.8v2.2M10 16v2.2M1.8 10H4M16 10h2.2M4.2 4.2l1.6 1.6M14.2 14.2l1.6 1.6M4.2 15.8l1.6-1.6M14.2 5.8l1.6-1.6"/></g></svg>
                    </button>
                    <button type="button" data-theme-choice="dark" title="Dark" aria-label="Dark">
                        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 12.6A7 7 0 0 1 7.4 3.5a7 7 0 1 0 9.1 9.1z" fill="currentColor"/></svg>
                    </button>
                </div>
            </div>

            <section class="panel">
                <h2>Chart</h2>
                <label class="field">
                    <span>Chart type</span>
                    <select id="chartType" class="select">
                        <option value="bar">Bar</option>
                        <option value="line">Line</option>
                        <option value="pie">Pie</option>
                        <option value="doughnut">Doughnut</option>
                        <option value="radar">Radar</option>
                    </select>
                </label>
                <label class="field">
                    <span>Title</span>
                    <input type="text" id="titleInput" class="input" placeholder="e.g. Revenue 2026">
                </label>
                <label class="field">
                    <span>Unit</span>
                    <input type="text" id="unitInput" class="input" placeholder="e.g. €, kg, %">
                </label>
                <label class="field axis-field">
                    <span>X-axis label</span>
                    <input type="text" id="xAxisInput" class="input" placeholder="e.g. Month">
                </label>
                <label class="field axis-field">
                    <span>Y-axis label</span>
                    <input type="text" id="yAxisInput" class="input" placeholder="e.g. Revenue">
                </label>
            </section>

            <section class="panel">
                <h2>Source</h2>
                <label class="field">
                    <span>Source name</span>
                    <input type="text" id="sourceInput" class="input" placeholder="e.g. Statistisches Bundesamt">
                </label>
                <label class="field">
                    <span>Link (optional)</span>
                    <input type="url" id="sourceUrlInput" class="input" placeholder="e.g. destatis.de">
                </label>
            </section>

            <section class="panel">
                <h2>Add data</h2>
                <form id="addForm" class="add-row">
                    <input type="text" id="labelInput" class="input" placeholder="Label">
                    <input type="number" step="any" id="dataInput" class="input" placeholder="Value">
                    <input type="color" id="colorInput" class="color" title="Color">
                    <button type="submit" class="btn">Add</button>
                </form>
            </section>

            <section class="panel">
                <h2>Data</h2>
                <ul id="dataList" class="data-list"></ul>
                <p id="emptyHint" class="hint">No data yet. Add a label and a value above.</p>
            </section>

            <section class="panel">
                <h2>Download</h2>
                <button id="pptxBtn" class="btn btn-wide">PowerPoint (.pptx)</button>
                <button id="pngBtn" class="btn btn-wide btn-secondary">Image (.png)</button>
            </section>
        </aside>

        <main class="chart-area">
            <div id="canvas-container" class="glass">
                <div class="chart-box">
                    <canvas id="myChart"></canvas>
                </div>
                <p id="sourceLine" class="source-line" hidden></p>
            </div>
        </main>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <script src="script.js?v=8"></script>
</body>

</html>
